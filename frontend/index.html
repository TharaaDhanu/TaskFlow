<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Full-Stack Project & Task Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useMemo } = React;

        // ==============================================================================
        // MOCK BACKEND ENGINE FOR STANDALONE DEMO EXECUTION
        // Connects dynamically to live Flask API if active, otherwise runs local DB state
        // ==============================================================================
        const API_BASE = "http://127.0.0.1:5000/api";

        const INITIAL_MOCK_USERS = [
            { id: 1, name: "System Admin", email: "admin@taskflow.demo", role: "admin", created_at: "2026-01-01T10:00:00Z" },
            { id: 2, name: "Alex Rivera", email: "alex@taskflow.demo", role: "user", created_at: "2026-01-02T11:00:00Z" },
            { id: 3, name: "Sam Chen", email: "sam@taskflow.demo", role: "user", created_at: "2026-01-03T12:00:00Z" }
        ];

        const INITIAL_MOCK_PROJECTS = [
            { id: 1, name: "Mobile App Redesign", description: "Complete UX overhaul of iOS and Android applications.", status: "active", owner_id: 1, owner_name: "System Admin", task_count: 5, completed_task_count: 2, progress: 40, created_at: "2026-01-10T09:00:00Z" },
            { id: 2, name: "Cloud Infrastructure Migration", description: "Migrating legacy servers to containerized AWS instances.", status: "active", owner_id: 1, owner_name: "System Admin", task_count: 4, completed_task_count: 2, progress: 50, created_at: "2026-01-12T14:00:00Z" },
            { id: 3, name: "Q3 Marketing Campaign", description: "Launch collateral for the upcoming v2.0 feature drop.", status: "planning", owner_id: 1, owner_name: "System Admin", task_count: 2, completed_task_count: 0, progress: 0, created_at: "2026-01-15T16:00:00Z" }
        ];

        const INITIAL_MOCK_TASKS = [
            { id: 1, title: "Design Wireframes for Onboarding", description: "Create Figma wireframes for user sign-up flow.", status: "completed", priority: "high", due_date: "2026-02-10", project_id: 1, project_name: "Mobile App Redesign", assigned_to: 2, assignee_name: "Alex Rivera", created_by: 1, creator_name: "System Admin", created_at: "2026-01-11T10:00:00Z" },
            { id: 2, title: "Implement Dark Mode Theme", description: "Add CSS variables and React toggle for dark theme.", status: "in_progress", priority: "medium", due_date: "2026-02-20", project_id: 1, project_name: "Mobile App Redesign", assigned_to: 3, assignee_name: "Sam Chen", created_by: 1, creator_name: "System Admin", created_at: "2026-01-11T11:30:00Z" },
            { id: 3, title: "Fix Navigation Gesture Bug", description: "Mobile menu freezes on swipe left on iOS devices.", status: "to_do", priority: "urgent", due_date: "2026-02-18", project_id: 1, project_name: "Mobile App Redesign", assigned_to: 2, assignee_name: "Alex Rivera", created_by: 1, creator_name: "System Admin", created_at: "2026-01-12T09:15:00Z" },
            { id: 4, title: "Audit Docker Containers", description: "Security scan for existing Docker images.", status: "completed", priority: "high", due_date: "2026-02-05", project_id: 2, project_name: "Cloud Infrastructure Migration", assigned_to: 3, assignee_name: "Sam Chen", created_by: 1, creator_name: "System Admin", created_at: "2026-01-13T08:00:00Z" },
            { id: 5, title: "Configure TerraForm Scripts", description: "Automate VPC creation and subnet allocation.", status: "in_progress", priority: "urgent", due_date: "2026-02-22", project_id: 2, project_name: "Cloud Infrastructure Migration", assigned_to: 3, assignee_name: "Sam Chen", created_by: 1, creator_name: "System Admin", created_at: "2026-01-14T13:45:00Z" },
            { id: 6, title: "Database Index Optimization", description: "Optimize query execution time on user lookup tables.", status: "review", priority: "medium", due_date: "2026-02-19", project_id: 2, project_name: "Cloud Infrastructure Migration", assigned_to: 2, assignee_name: "Alex Rivera", created_by: 1, creator_name: "System Admin", created_at: "2026-01-15T15:20:00Z" },
            { id: 7, title: "Draft Press Release", description: "Write copy for tech news publication announcement.", status: "to_do", priority: "low", due_date: "2026-03-01", project_id: 3, project_name: "Q3 Marketing Campaign", assigned_to: 2, assignee_name: "Alex Rivera", created_by: 1, creator_name: "System Admin", created_at: "2026-01-16T11:10:00Z" },
            { id: 8, title: "Design Email Banners", description: "Export SVG assets for customer newsletter.", status: "to_do", priority: "medium", due_date: "2026-02-28", project_id: 3, project_name: "Q3 Marketing Campaign", assigned_to: 3, assignee_name: "Sam Chen", created_by: 1, creator_name: "System Admin", created_at: "2026-01-17T10:00:00Z" }
        ];

        // Service Abstraction
        const apiService = {
            async request(endpoint, options = {}) {
                const token = localStorage.getItem('tf_token');
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                try {
                    const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
                    const json = await res.json();
                    if (!res.ok) throw new Error(json.error?.message || 'API request failed');
                    return json.data;
                } catch (err) {
                    // Fallback to local state execution if live backend is offline
                    return apiService.fallbackMock(endpoint, options);
                }
            },

            fallbackMock(endpoint, options) {
                // Persistent LocalStorage State Fallback
                let users = JSON.parse(localStorage.getItem('mock_users')) || INITIAL_MOCK_USERS;
                let projects = JSON.parse(localStorage.getItem('mock_projects')) || INITIAL_MOCK_PROJECTS;
                let tasks = JSON.parse(localStorage.getItem('mock_tasks')) || INITIAL_MOCK_TASKS;

                const save = () => {
                    localStorage.setItem('mock_users', JSON.stringify(users));
                    localStorage.setItem('mock_projects', JSON.stringify(projects));
                    localStorage.setItem('mock_tasks', JSON.stringify(tasks));
                };

                const method = options.method || 'GET';
                const body = options.body ? JSON.parse(options.body) : {};

                if (endpoint === '/auth/login') {
                    const user = users.find(u => u.email === body.email);
                    if (!user) throw new Error("Invalid email or password");
                    return { token: `mock-jwt-${user.id}`, user };
                }
                if (endpoint === '/auth/register') {
                    if (users.find(u => u.email === body.email)) throw new Error("Email already registered");
                    const user = { id: Date.now(), name: body.name, email: body.email, role: 'user', created_at: new Date().toISOString() };
                    users.push(user);
                    save();
                    return { token: `mock-jwt-${user.id}`, user };
                }
                if (endpoint === '/auth/me') {
                    const authHeader = options.headers?.['Authorization'] || '';
                    const userId = parseInt(authHeader.replace('Bearer mock-jwt-', ''));
                    const user = users.find(u => u.id === userId) || users[0];
                    return user;
                }
                if (endpoint === '/projects' && method === 'GET') {
                    return projects.map(p => {
                        const pTasks = tasks.filter(t => t.project_id === p.id);
                        const comp = pTasks.filter(t => t.status === 'completed').length;
                        return { ...p, task_count: pTasks.length, completed_task_count: comp, progress: pTasks.length ? Math.round((comp / pTasks.length) * 100) : 0 };
                    });
                }
                if (endpoint === '/projects' && method === 'POST') {
                    const newProj = { id: Date.now(), name: body.name, description: body.description, status: body.status || 'active', owner_id: 1, owner_name: 'System Admin', task_count: 0, completed_task_count: 0, progress: 0, created_at: new Date().toISOString() };
                    projects.push(newProj);
                    save();
                    return newProj;
                }
                if (endpoint.startsWith('/projects/') && method === 'DELETE') {
                    const id = parseInt(endpoint.split('/')[2]);
                    projects = projects.filter(p => p.id !== id);
                    tasks = tasks.filter(t => t.project_id !== id);
                    save();
                    return { message: "Project deleted" };
                }
                if (endpoint.startsWith('/tasks') && method === 'GET') {
                    return tasks;
                }
                if (endpoint === '/tasks' && method === 'POST') {
                    const proj = projects.find(p => p.id === parseInt(body.project_id));
                    const assignee = users.find(u => u.id === parseInt(body.assigned_to));
                    const newTask = {
                        id: Date.now(),
                        title: body.title,
                        description: body.description || '',
                        status: body.status || 'to_do',
                        priority: body.priority || 'medium',
                        due_date: body.due_date || '',
                        project_id: parseInt(body.project_id),
                        project_name: proj ? proj.name : 'Project',
                        assigned_to: body.assigned_to ? parseInt(body.assigned_to) : null,
                        assignee_name: assignee ? assignee.name : 'Unassigned',
                        created_by: 1,
                        creator_name: 'System Admin',
                        created_at: new Date().toISOString()
                    };
                    tasks.unshift(newTask);
                    save();
                    return newTask;
                }
                if (endpoint.startsWith('/tasks/') && method === 'PUT') {
                    const id = parseInt(endpoint.split('/')[2]);
                    const idx = tasks.findIndex(t => t.id === id);
                    if (idx !== -1) {
                        const proj = body.project_id ? projects.find(p => p.id === parseInt(body.project_id)) : null;
                        const assignee = body.assigned_to ? users.find(u => u.id === parseInt(body.assigned_to)) : null;
                        tasks[idx] = { 
                            ...tasks[idx], 
                            ...body,
                            ...(proj && { project_name: proj.name }),
                            ...(body.assigned_to !== undefined && { assignee_name: assignee ? assignee.name : 'Unassigned' })
                        };
                        save();
                        return tasks[idx];
                    }
                }
                if (endpoint.startsWith('/tasks/') && method === 'DELETE') {
                    const id = parseInt(endpoint.split('/')[2]);
                    tasks = tasks.filter(t => t.id !== id);
                    save();
                    return { message: "Task deleted" };
                }
                if (endpoint === '/users' && method === 'GET') return users;
                if (endpoint.startsWith('/users/') && method === 'PUT') {
                    const id = parseInt(endpoint.split('/')[2]);
                    const user = users.find(u => u.id === id);
                    if (user) { user.role = body.role; save(); return user; }
                }
                if (endpoint.startsWith('/users/') && method === 'DELETE') {
                    const id = parseInt(endpoint.split('/')[2]);
                    users = users.filter(u => u.id !== id);
                    save();
                    return { message: "User deleted" };
                }
                if (endpoint === '/admin/stats') {
                    const today = new Date().toISOString().split('T')[0];
                    return {
                        total_users: users.length,
                        total_projects: projects.length,
                        active_projects: projects.filter(p => p.status === 'active').length,
                        total_tasks: tasks.length,
                        completed_tasks: tasks.filter(t => t.status === 'completed').length,
                        overdue_tasks: tasks.filter(t => t.due_date && t.due_date < today && t.status !== 'completed').length
                    };
                }
                return {};
            }
        };

        // ==============================================================================
        // CONTEXT PROVIDERS (AUTH & TOAST)
        // ==============================================================================
        const AuthContext = createContext();
        const ToastContext = createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const showToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            };
            return (
                <ToastContext.Provider value={{ showToast }}>
                    {children}
                    <div className="fixed bottom-5 right-5 z-50 flex flex-col gap-2">
                        {toasts.map(t => (
                            <div key={t.id} className={`px-4 py-3 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 border text-white ${
                                t.type === 'error' ? 'bg-red-600 border-red-700' :
                                t.type === 'success' ? 'bg-emerald-600 border-emerald-700' : 'bg-slate-800 border-slate-700'
                            }`}>
                                <i className={`fa-solid ${t.type === 'error' ? 'fa-circle-exclamation' : t.type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}`}></i>
                                {t.message}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const initAuth = async () => {
                    const token = localStorage.getItem('tf_token');
                    if (token) {
                        try {
                            const u = await apiService.request('/auth/me');
                            setUser(u);
                        } catch (err) {
                            localStorage.removeItem('tf_token');
                        }
                    }
                    setLoading(false);
                };
                initAuth();
            }, []);

            const login = async (email, password) => {
                const res = await apiService.request('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                localStorage.setItem('tf_token', res.token);
                setUser(res.user);
                return res.user;
            };

            const register = async (name, email, password) => {
                const res = await apiService.request('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password })
                });
                localStorage.setItem('tf_token', res.token);
                setUser(res.user);
                return res.user;
            };

            const logout = () => {
                localStorage.removeItem('tf_token');
                setUser(null);
            };

            return (
                <AuthContext.Provider value={{ user, loading, login, register, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const useAuth = () => useContext(AuthContext);
        const useToast = () => useContext(ToastContext);

        // ==============================================================================
        // COMMON UI COMPONENTS
        // ==============================================================================
        const StatusBadge = ({ status }) => {
            const styles = {
                to_do: "bg-slate-100 text-slate-700 border-slate-300",
                in_progress: "bg-blue-50 text-blue-700 border-blue-200",
                review: "bg-amber-50 text-amber-700 border-amber-200",
                completed: "bg-emerald-50 text-emerald-700 border-emerald-200",
                active: "bg-emerald-50 text-emerald-700 border-emerald-200",
                planning: "bg-purple-50 text-purple-700 border-purple-200",
                on_hold: "bg-amber-50 text-amber-700 border-amber-200"
            };
            const labels = {
                to_do: "To Do", in_progress: "In Progress", review: "Review", completed: "Completed",
                active: "Active", planning: "Planning", on_hold: "On Hold"
            };
            return (
                <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${styles[status] || styles.to_do}`}>
                    {labels[status] || status}
                </span>
            );
        };

        const PriorityBadge = ({ priority }) => {
            const styles = {
                low: "text-slate-600 bg-slate-100",
                medium: "text-blue-700 bg-blue-50",
                high: "text-amber-700 bg-amber-50",
                urgent: "text-red-700 bg-red-50 font-bold"
            };
            return (
                <span className={`px-2 py-0.5 text-xs rounded uppercase tracking-wider ${styles[priority] || styles.medium}`}>
                    {priority}
                </span>
            );
        };

        const LoadingSpinner = () => (
            <div className="flex justify-center items-center py-12">
                <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-brand-600"></div>
            </div>
        );

        // ==============================================================================
        // MAIN APP NAVIGATION & LAYOUT
        // ==============================================================================
        const Sidebar = ({ currentTab, setTab, mobileOpen, setMobileOpen }) => {
            const { user, logout } = useAuth();
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'projects', label: 'Projects', icon: 'fa-folder-closed' },
                { id: 'tasks', label: 'Tasks', icon: 'fa-list-check' },
                { id: 'profile', label: 'Profile', icon: 'fa-user' }
            ];

            if (user?.role === 'admin') {
                navItems.push({ id: 'admin', label: 'Admin Panel', icon: 'fa-shield-halved' });
            }

            const activeClass = "bg-brand-600 text-white font-medium shadow-sm";
            const inactiveClass = "text-slate-600 hover:bg-slate-100 hover:text-slate-900 font-medium";

            return (
                <>
                    {/* Mobile Backdrop */}
                    {mobileOpen && (
                        <div onClick={() => setMobileOpen(false)} className="fixed inset-0 bg-slate-900/40 z-30 lg:hidden"></div>
                    )}
                    
                    <aside className={`fixed top-0 left-0 bottom-0 w-64 bg-white border-r border-slate-200 z-40 flex flex-col transition-transform duration-200 ease-in-out ${mobileOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        {/* Brand */}
                        <div className="h-16 flex items-center px-6 border-b border-slate-200 justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 bg-brand-600 text-white rounded-lg flex items-center justify-center font-black text-xl tracking-wider shadow-sm">
                                    T
                                </div>
                                <span className="font-bold text-lg text-slate-900 tracking-tight">TaskFlow</span>
                            </div>
                            <button onClick={() => setMobileOpen(false)} className="lg:hidden text-slate-500 hover:text-slate-700">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Nav Items */}
                        <nav className="flex-1 px-4 py-6 space-y-1.5 custom-scrollbar overflow-y-auto">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => { setTab(item.id); setMobileOpen(false); }}
                                    className={`w-full flex items-center gap-3.5 px-3.5 py-2.5 rounded-lg text-sm transition-colors ${currentTab === item.id ? activeClass : inactiveClass}`}
                                >
                                    <i className={`fa-solid ${item.icon} w-5 text-center text-base`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        {/* User Footer */}
                        <div className="p-4 border-t border-slate-200 bg-slate-50/50">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3 min-w-0">
                                    <div className="w-8 h-8 rounded-full bg-slate-700 text-white font-semibold flex items-center justify-center text-xs">
                                        {user?.name.charAt(0)}
                                    </div>
                                    <div className="min-w-0">
                                        <p className="text-sm font-semibold text-slate-800 truncate">{user?.name}</p>
                                        <p className="text-xs text-slate-500 capitalize">{user?.role}</p>
                                    </div>
                                </div>
                                <button onClick={logout} title="Sign Out" className="p-2 text-slate-400 hover:text-red-600 rounded-lg hover:bg-slate-100 transition-colors">
                                    <i className="fa-solid fa-right-from-bracket"></i>
                                </button>
                            </div>
                        </div>
                    </aside>
                </>
            );
        };

        // ==============================================================================
        // VIEWS & PAGES
        // ==============================================================================

        // 1. LANDING PAGE
        const LandingPage = ({ onNavigate }) => (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col justify-between">
                <header className="max-w-7xl mx-auto w-full px-6 py-6 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center font-black text-2xl shadow-lg">
                            T
                        </div>
                        <span className="font-bold text-xl tracking-tight">TaskFlow</span>
                    </div>
                    <div className="flex items-center gap-4">
                        <button onClick={() => onNavigate('login')} className="text-slate-300 hover:text-white font-medium text-sm px-4 py-2">
                            Sign In
                        </button>
                        <button onClick={() => onNavigate('register')} className="bg-brand-500 hover:bg-brand-600 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow-md transition-colors">
                            Get Started
                        </button>
                    </div>
                </header>

                <main className="max-w-5xl mx-auto px-6 py-20 text-center">
                    <div className="inline-block px-4 py-1.5 rounded-full bg-brand-500/10 text-brand-400 font-medium text-xs mb-6 border border-brand-500/20">
                        Built for Modern Agile Teams
                    </div>
                    <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                        Plan Better. Work Smarter. <br />
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-sky-200">
                            Deliver Faster.
                        </span>
                    </h1>
                    <p className="text-lg md:text-xl text-slate-400 max-w-2xl mx-auto mb-10">
                        TaskFlow helps teams organize projects, manage tasks, and keep work moving with real-time metrics and seamless authorization.
                    </p>
                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
                        <button onClick={() => onNavigate('register')} className="w-full sm:w-auto bg-brand-500 hover:bg-brand-600 text-white font-semibold px-8 py-3.5 rounded-lg shadow-lg text-base transition-colors">
                            Start Free Trial
                        </button>
                        <button onClick={() => onNavigate('login')} className="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-8 py-3.5 rounded-lg border border-slate-700 text-base transition-colors">
                            View Live Demo Accounts
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mt-24 text-left">
                        <div className="p-6 rounded-2xl bg-slate-800/50 border border-slate-800">
                            <div className="w-12 h-12 bg-brand-500/10 text-brand-400 rounded-xl flex items-center justify-center text-xl mb-4">
                                <i className="fa-solid fa-diagram-project"></i>
                            </div>
                            <h3 className="text-lg font-bold mb-2">Project Tracking</h3>
                            <p className="text-slate-400 text-sm">Organize workloads into structured projects with clear ownership and progress calculations.</p>
                        </div>
                        <div className="p-6 rounded-2xl bg-slate-800/50 border border-slate-800">
                            <div className="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl mb-4">
                                <i className="fa-solid fa-list-check"></i>
                            </div>
                            <h3 className="text-lg font-bold mb-2">Fine-Grained Tasks</h3>
                            <p className="text-slate-400 text-sm">Assign priorities, set due dates, and update task statuses through an intuitive workflow.</p>
                        </div>
                        <div className="p-6 rounded-2xl bg-slate-800/50 border border-slate-800">
                            <div className="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl mb-4">

                        apiService.request('/users')
                    ]);
                    setTasks(tasksRes);
                    setProjects(projectsRes);
                    setUsers(usersRes);
                    if (projectsRes.length > 0 && !formData.project_id) {
                        setFormData(prev => ({ ...prev, project_id: projectsRes[0].id }));

                    const matchesPriority = priorityFilter ? t.priority === priorityFilter : true;
                    const matchesProject = projectFilter ? t.project_id === parseInt(projectFilter) : true;

                        <button onClick={handleOpenCreate} className="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm shadow-sm flex items-center gap-2 transition-colors">
                            <i className="fa-solid fa-plus"></i> Create Task
                        </button>
                    </div>

                    {/* Filter Bar */}
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        <input
                            type="text"
                            placeholder="Search tasks..."
                            value={search}
                            onChange={e => setSearch(e.target.value)}
                            className="px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                        />
                        <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">
                            <option value="">All Statuses</option>
                            <option value="to_do">To Do</option>
                            <option value="in_progress">In Progress</option>
                            <option value="review">Review</option>
                            <option value="completed">Completed</option>
                        </select>
                        <select value={priorityFilter} onChange={e => setPriorityFilter(e.target.value)} className="px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">
                            <option value="">All Priorities</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                        <select value={projectFilter} onChange={e => setProjectFilter(e.target.value)} className="px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">
                            <option value="">All Projects</option>
                            {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                    </div>

                    {/* Task Table */}
                    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-500 uppercase text-[11px] font-bold tracking-wider border-b border-slate-200">
                                        <th className="py-3.5 px-6">Task</th>
                                        <th className="py-3.5 px-4">Project</th>
                                        <th className="py-3.5 px-4">Assignee</th>
                                        <th className="py-3.5 px-4">Priority</th>
                                        <th className="py-3.5 px-4">Status</th>
                                        <th className="py-3.5 px-4">Due Date</th>
                                        <th className="py-3.5 px-6 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {filteredTasks.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="py-12 text-center text-slate-500">
                                                No matching tasks found.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredTasks.map(t => (
                                            <tr key={t.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="py-4 px-6 font-medium text-slate-900">
                                                    <div>{t.title}</div>
                                                    {t.description && <div className="text-xs text-slate-400 font-normal line-clamp-1">{t.description}</div>}
                                                </td>
                                                <td className="py-4 px-4 text-slate-600 font-medium">{t.project_name}</td>
                                                <td className="py-4 px-4 text-slate-600">
                                                    <span className="inline-flex items-center gap-1.5">
                                                        <i className="fa-regular fa-user text-xs text-slate-400"></i>
                                                        {t.assignee_name}
                                                    </span>
                                                </td>
                                                <td className="py-4 px-4"><PriorityBadge priority={t.priority} /></td>
                                                <td className="py-4 px-4"><StatusBadge status={t.status} /></td>
                                                <td className="py-4 px-4 text-slate-500 text-xs font-mono">{t.due_date || 'None'}</td>
                                                <td className="py-4 px-6 text-right space-x-2">
                                                    <button onClick={() => handleOpenEdit(t)} className="p-1.5 text-slate-400 hover:text-brand-600 rounded">
                                                        <i className="fa-solid fa-pen"></i>
                                                    </button>
                                                    {(user?.role === 'admin' || t.created_by === user?.id) && (
                                                        <button onClick={() => handleDelete(t.id)} className="p-1.5 text-slate-400 hover:text-red-600 rounded">
                                                            <i className="fa-solid fa-trash"></i>
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Task Create / Edit Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
                                <h2 className="text-xl font-bold text-slate-900 mb-4">{editingTask ? 'Edit Task' : 'Create New Task'}</h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Title *</label>
                                        <input
                                            type="text"
                                            required
                                            value={formData.title}
                                            onChange={e => setFormData({ ...formData, title: e.target.value })}
                                            className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            placeholder="Task summary"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Description</label>
                                        <textarea
                                            rows="2"
                                            value={formData.description}
                                            onChange={e => setFormData({ ...formData, description: e.target.value })}
                                            className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            placeholder="Detailed instructions..."
                                        ></textarea>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Project *</label>
                                            <select
                                                required
                                                value={formData.project_id}
                                                onChange={e => setFormData({ ...formData, project_id: e.target.value })}
                                                className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            >
                                                {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Assignee</label>
                                            <select
                                                value={formData.assigned_to}
                                                onChange={e => setFormData({ ...formData, assigned_to: e.target.value })}
                                                className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            >
                                                <option value="">Unassigned</option>
                                                {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Status</label>
                                            <select
                                                value={formData.status}
                                                onChange={e => setFormData({ ...formData, status: e.target.value })}
                                                className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            >
                                                <option value="to_do">To Do</option>
                                                <option value="in_progress">In Progress</option>
                                                <option value="review">Review</option>
                                                <option value="completed">Completed</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Priority</label>
                                            <select
                                                value={formData.priority}
                                                onChange={e => setFormData({ ...formData, priority: e.target.value })}
                                                className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            >
                                                <option value="low">Low</option>
                                                <option value="medium">Medium</option>
                                                <option value="high">High</option>
                                                <option value="urgent">Urgent</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Due Date</label>
                                            <input
                                                type="date"
                                                value={formData.due_date}
                                                onChange={e => setFormData({ ...formData, due_date: e.target.value })}
                                                className="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500"
                                            />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 pt-4">
                                        <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
                                        <button type="submit" className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium">{editingTask ? 'Save Changes' : 'Create Task'}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 6. ADMIN DASHBOARD & USER MANAGEMENT VIEW
        const AdminView = () => {
            const { user: currentUser } = useAuth();
            const { showToast } = useToast();
            const [users, setUsers] = useState([]);
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(true);

            const fetchAdminData = async () => {
                try {
                    const [usersData, statsData] = await Promise.all([
                        apiService.request('/users'),
                        apiService.request('/admin/stats')
                    ]);
                    setUsers(usersData);
                    setStats(statsData);
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchAdminData(); }, []);

            const handleToggleRole = async (user) => {
                const newRole = user.role === 'admin' ? 'user' : 'admin';
                try {
                    await apiService.request(`/users/${user.id}`, {
                        method: 'PUT',
                        body: JSON.stringify({ role: newRole })
                    });
                    showToast(`Updated ${user.name}'s role to ${newRole}`, 'success');
                    fetchAdminData();
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            const handleDeleteUser = async (id) => {
                if (!confirm("Are you sure you want to remove this user account?")) return;
                try {
                    await apiService.request(`/users/${id}`, { method: 'DELETE' });
                    showToast('User deleted', 'success');
                    fetchAdminData();
                } catch (err) {
                    showToast(err.message, 'error');
                }
            };

            if (loading) return <LoadingSpinner />;

            return (
                <div className="space-y-8">
                    <div>
                        <h1 className="text-2xl font-bold text-slate-900">Admin Control Center</h1>
                        <p className="text-slate-500 text-sm mt-1">System diagnostics and user role administration</p>
                    </div>

                    {/* Admin Diagnostic Widgets */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-500 uppercase">Total System Users</span>
                            <div className="text-3xl font-extrabold text-slate-900 mt-2">{stats.total_users}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-500 uppercase">Active Projects</span>
                            <div className="text-3xl font-extrabold text-brand-600 mt-2">{stats.active_projects} / {stats.total_projects}</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-500 uppercase">Total Tasks Tracked</span>
                            <div className="text-3xl font-extrabold text-emerald-600 mt-2">{stats.total_tasks}</div>
                        </div>
                    </div>

                    {/* Users Management Table */}
                    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <div className="px-6 py-4 border-b border-slate-200">
                            <h3 className="font-bold text-slate-900 text-base">User Directory & Authorization</h3>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-500 uppercase text-[11px] font-bold tracking-wider border-b border-slate-200">
                                        <th className="py-3 px-6">User</th>
                                        <th className="py-3 px-4">Email</th>
                                        <th className="py-3 px-4">Role</th>
                                        <th className="py-3 px-4">Joined</th>
                                        <th className="py-3 px-6 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {users.map(u => (
                                        <tr key={u.id} className="hover:bg-slate-50/80">
                                            <td className="py-4 px-6 font-semibold text-slate-900">{u.name}</td>
                                            <td className="py-4 px-4 text-slate-600">{u.email}</td>
                                            <td className="py-4 px-4">
                                                <span className={`px-2.5 py-0.5 text-xs font-bold rounded-full ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-slate-100 text-slate-700'}`}>
                                                    {u.role}
                                                </span>
                                            </td>
                                            <td className="py-4 px-4 text-xs text-slate-400 font-mono">
                                                {new Date(u.created_at).toLocaleDateString()}
                                            </td>
                                            <td className="py-4 px-6 text-right space-x-2">
                                                <button
                                                    onClick={() => handleToggleRole(u)}
                                                    className="px-2.5 py-1 text-xs font-medium border border-slate-300 rounded hover:bg-slate-50 transition-colors"
                                                >
                                                    Set to {u.role === 'admin' ? 'User' : 'Admin'}
                                                </button>
                                                {u.id !== currentUser.id && (
                                                    <button
                                                        onClick={() => handleDeleteUser(u.id)}
                                                        className="px-2 py-1 text-xs text-red-600 hover:text-red-800 font-semibold"
                                                    >
                                                        Delete
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // 7. USER PROFILE VIEW
        const ProfileView = () => {
            const { user } = useAuth();
            return (
                <div className="max-w-xl mx-auto space-y-6">
                    <div>
                        <h1 className="text-2xl font-bold text-slate-900">Account Profile</h1>
                        <p className="text-slate-500 text-sm mt-1">Your personal account details</p>
                    </div>

                    <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                        <div className="flex items-center gap-4 pb-4 border-b border-slate-100">
                            <div className="w-16 h-16 rounded-full bg-slate-800 text-white text-2xl font-bold flex items-center justify-center">
                                {user?.name?.charAt(0)}
                            </div>
                            <div>
                                <h3 className="text-lg font-bold text-slate-900">{user?.name}</h3>
                                <p className="text-sm text-slate-500 capitalize">{user?.role} Account</p>
                            </div>
                        </div>

                        <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email Address</label>
                            <p className="text-sm font-medium text-slate-800">{user?.email}</p>
                        </div>

                        <div>
                            <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Account Created</label>
                            <p className="text-sm font-medium text-slate-800">{new Date(user?.created_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                </div>
            );
        };

        // ==============================================================================
        // CORE APPLICATION CONTROLLER
        // ==============================================================================
        const MainApp = () => {
            const { user, loading } = useAuth();
            const [currentTab, setTab] = useState('dashboard');
            const [mobileOpen, setMobileOpen] = useState(false);
            const [authView, setAuthView] = useState('landing'); // 'landing', 'login', 'register'

            if (loading) return <LoadingSpinner />;

            if (!user) {
                if (authView === 'login' || authView === 'register') {
                    return <AuthPage mode={authView} onNavigate={setAuthView} />;
                }
                return <LandingPage onNavigate={setAuthView} />;
            }

            return (
                <div className="min-h-screen bg-slate-50 flex">
                    <Sidebar currentTab={currentTab} setTab={setTab} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />

                    <div className="flex-1 lg:pl-64 flex flex-col min-w-0">
                        {/* Mobile Header Topbar */}
                        <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between lg:hidden sticky top-0 z-20">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setMobileOpen(true)} className="text-slate-600 hover:text-slate-900 p-1">
                                    <i className="fa-solid fa-bars text-xl"></i>
                                </button>
                                <span className="font-bold text-slate-900">TaskFlow</span>
                            </div>
                        </header>

                        {/* Main View Area */}
                        <main className="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto">
                            {currentTab === 'dashboard' && <DashboardView setTab={setTab} />}
                            {currentTab === 'projects' && <ProjectsView />}
                            {currentTab === 'tasks' && <TasksView />}
                            {currentTab === 'admin' && (user.role === 'admin' ? <AdminView /> : <DashboardView setTab={setTab} />)}
                            {currentTab === 'profile' && <ProfileView />}
                        </main>
                    </div>
                </div>
            );
        };

        const App = () => (
            <ToastProvider>
                <AuthProvider>
                    <MainApp />
                </AuthProvider>
            </ToastProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
